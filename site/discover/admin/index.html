<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>مدیریت لینک‌های ریلز</title><link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="./admin.css"><link rel="stylesheet" href="../../ux-clarity.css"><link rel="stylesheet" href="../../ui-pro-max.css"><link rel="stylesheet" href="../../ui-pro-max-components.css"></head><body><header class="admin-topbar"><strong>PersianToolbox · Discover Admin</strong><a href="../">صفحه عمومی</a></header><main><section class="admin-heading"><div><h1>مدیریت لینک‌های ریلز</h1><p>لینک و توضیحات را بدون deploy مدیریت کن.</p></div><button id="admin-new-tool" type="button">ابزار جدید</button></section><div class="admin-layout"><section><h2>ابزارها</h2><p id="admin-drag-hint" class="admin-hint">برای تغییر سریع ترتیب، دستگیره هر ردیف را بکش. فیلد ترتیب عددی همیشه به‌عنوان روش جایگزین فعال است.</p><div id="admin-tools-list"></div></section><form id="admin-tool-form"><input name="id" type="hidden"><input name="name" required placeholder="نام"><input name="slug" required placeholder="slug"><div class="admin-icon-fields"><select name="icon_provider" aria-label="منبع آیکن"><option value="generic">آیکن عمومی</option><option value="simple-icons">Simple Icons</option></select><input name="icon_key" maxlength="80" value="sparkles" pattern="[a-z0-9][a-z0-9_-]{0,79}" placeholder="مثلاً github"><img id="admin-icon-preview" src="../assets/sparkles.svg" alt="" width="42" height="42"></div><textarea name="short_description_fa" required placeholder="توضیح کوتاه"></textarea><textarea name="description_fa" placeholder="توضیح کامل"></textarea><input name="destination_url" type="url" required placeholder="https://"><select name="platform"><option value="android">Android</option><option value="ios">iOS</option><option value="web">Web</option><option value="telegram">Telegram</option><option value="desktop">Desktop</option><option value="multi">Multi</option></select><input name="category" required value="assistant"><input name="capabilities" placeholder="capabilities"><input name="badges" placeholder="badges"><input name="cta_label_fa" value="باز کردن ابزار"><input name="last_tested_date" type="date"><input name="sort_order" type="number" value="0"><textarea name="access_note_fa" placeholder="نکته دسترسی"></textarea><label><input name="featured" type="checkbox">ویژه</label><label><input name="published" type="checkbox">منتشر</label><p id="admin-save-status" role="status" aria-live="polite"></p><div class="admin-actions"><button id="admin-save" type="submit">ذخیره</button><button id="admin-cancel" type="button">لغو</button><button id="admin-delete" type="button" hidden>حذف دائمی</button></div></form></div></main><script src="../canonical-only.js"></script><script src="./vendor/sortable.min.js" defer></script><script src="./admin.js" defer></script></body></html>
