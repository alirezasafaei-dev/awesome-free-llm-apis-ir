name: Deploy Discover pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-discover-production-global
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify complete Discover contracts
        run: npm run discover:test

      - name: Verify static Discover assets
        run: npm run site:build
        env:
          SOURCE_REVISION: ${{ github.sha }}

      - name: Package bounded Discover release
        run: tar -czf discover-release.tgz services/discover deploy/discover deploy/caddy/llm.persiantoolbox.ir.caddy deploy/caddy/apply-caddy-config.sh node_modules/simple-icons package.json package-lock.json

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Validate and write private admin material
        env:
          DISCOVER_ADMIN_USER: ${{ secrets.DISCOVER_ADMIN_USER }}
          DISCOVER_ADMIN_PASSWORD_HASH: ${{ secrets.DISCOVER_ADMIN_PASSWORD_HASH }}
          DISCOVER_ADMIN_PASSWORD: ${{ secrets.DISCOVER_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          test -n "$DISCOVER_ADMIN_USER"
          test -n "$DISCOVER_ADMIN_PASSWORD_HASH"
          test -n "$DISCOVER_ADMIN_PASSWORD"
          [[ "$DISCOVER_ADMIN_USER" =~ ^[A-Za-z0-9._-]{8,64}$ ]]
          case "$DISCOVER_ADMIN_PASSWORD_HASH" in
            '$2a$'*|'$2b$'*|'$2y$'*) ;;
            *) echo "Discover admin password hash is not bcrypt." >&2; exit 1 ;;
          esac
          [[ "$DISCOVER_ADMIN_PASSWORD_HASH" != *$'\n'* ]]
          [[ "$DISCOVER_ADMIN_USER" != *$'\n'* ]]
          umask 077
          printf 'DISCOVER_ADMIN_USER=%s\nDISCOVER_ADMIN_PASSWORD_HASH=%s\n' \
            "$DISCOVER_ADMIN_USER" "$DISCOVER_ADMIN_PASSWORD_HASH" > discover-admin.env

      - name: Stage Discover release on canonical host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "rm -rf -- '$stage' && install -d -m 700 '$stage'"
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            discover-release.tgz discover-admin.env "$remote:$stage/"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "tar -xzf '$stage/discover-release.tgz' -C '$stage'"

      - name: Activate sidecar and canonical Caddy boundary
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' RELEASE_ID='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGE"
          sudo bash deploy/discover/install-discover-service.sh "$STAGE" "$RELEASE_ID"

          sudo install -d -m 755 /etc/systemd/system/caddy.service.d
          sudo install -m 600 "$STAGE/discover-admin.env" /etc/persiantoolbox-discover/caddy.env
          printf '%s\n' '[Service]' 'EnvironmentFile=/etc/persiantoolbox-discover/caddy.env' | \
            sudo tee /etc/systemd/system/caddy.service.d/discover-admin.conf >/dev/null
          sudo chmod 644 /etc/systemd/system/caddy.service.d/discover-admin.conf
          sudo systemctl daemon-reload

          export DISCOVER_ADMIN_USER="$(sed -n 's/^DISCOVER_ADMIN_USER=//p' "$STAGE/discover-admin.env")"
          export DISCOVER_ADMIN_PASSWORD_HASH="$(sed -n 's/^DISCOVER_ADMIN_PASSWORD_HASH=//p' "$STAGE/discover-admin.env")"
          test -n "$DISCOVER_ADMIN_USER" && test -n "$DISCOVER_ADMIN_PASSWORD_HASH"

          bash deploy/caddy/apply-caddy-config.sh
          sudo systemctl restart caddy
          sudo systemctl is-active --quiet caddy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8003/discover/api/health | grep -q '"ok":true'
          REMOTE

      - name: Verify public health and admin authentication boundary
        env:
          DISCOVER_ADMIN_USER: ${{ secrets.DISCOVER_ADMIN_USER }}
          DISCOVER_ADMIN_PASSWORD: ${{ secrets.DISCOVER_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --max-time 15 \
            https://llm.persiantoolbox.ir/discover/api/health | grep -q '"ok":true'

          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "$headers" \
            --write-out '%{http_code}' https://llm.persiantoolbox.ir/discover/admin/)"
          test "$status" = "401"
          grep -Eiq '^www-authenticate:.*basic' "$headers"
          rm -f "$headers"

          curl --fail --silent --show-error --max-time 15 --user "$DISCOVER_ADMIN_USER:$DISCOVER_ADMIN_PASSWORD" \
            --output /dev/null https://llm.persiantoolbox.ir/discover/api/admin/tools

      - name: Prove zero-deploy CRUD on the real service
        env:
          DISCOVER_BASE_URL: https://llm.persiantoolbox.ir/discover
          DISCOVER_ADMIN_USER: ${{ secrets.DISCOVER_ADMIN_USER }}
          DISCOVER_ADMIN_PASSWORD: ${{ secrets.DISCOVER_ADMIN_PASSWORD }}
        run: node scripts/check-discover-live-crud.mjs

      - name: Remove staged release material
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [[ -f ~/.ssh/id_ed25519 && -n "${SSH_HOST:-}" && -n "${SSH_USER:-}" && -n "${SSH_PORT:-}" ]]; then
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "${SSH_USER}@${SSH_HOST}" "rm -rf -- '/tmp/persiantoolbox-discover-${GITHUB_SHA}'" || true
          fi
          rm -f discover-release.tgz discover-admin.env

      - name: Remove local SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
