name: Discover pre-merge activation

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

concurrency:
  group: discover-premerge-activation-250
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  activate:
    if: >-
      github.repository == 'alirezasafaei-dev/awesome-free-llm-apis-ir' &&
      github.event.pull_request.number == 250 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/discover-admin-implementation-2026-08-13' &&
      github.actor == 'alirezasafaei-dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-global
      url: https://llm.persiantoolbox.ir/discover/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: 22
          cache: npm

      - name: Verify candidate before production mutation
        run: |
          set -Eeuo pipefail
          npm ci
          npm run discover:test

      - name: Prepare bounded release and ephemeral admin secret
        env:
          CONFIGURED_ADMIN_USER: ${{ secrets.DISCOVER_ADMIN_USER }}
          CONFIGURED_ADMIN_PASSWORD: ${{ secrets.DISCOVER_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          tar -czf discover-bootstrap.tgz \
            services/discover \
            deploy/discover \
            deploy/caddy/llm.persiantoolbox.ir.caddy \
            deploy/caddy/apply-caddy-config.sh \
            node_modules/simple-icons \
            package.json package-lock.json

          admin_user="${CONFIGURED_ADMIN_USER:-discover-admin}"
          admin_password="${CONFIGURED_ADMIN_PASSWORD:-}"
          if [[ -z "$admin_password" ]]; then
            admin_password="$(openssl rand -hex 32)"
          fi
          [[ "$admin_user" =~ ^[A-Za-z0-9._-]{8,64}$ ]]
          [[ "$admin_password" =~ ^[A-Za-z0-9._~+-]{24,128}$ ]]
          umask 077
          printf '%s' "$admin_user" > .discover-admin-user
          printf '%s' "$admin_password" > .discover-admin-password
          chmod 600 .discover-admin-user .discover-admin-password

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Stage candidate and capture rollback state
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-bootstrap-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "rm -rf -- '$stage' && install -d -m 700 '$stage'"
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            discover-bootstrap.tgz .discover-admin-user .discover-admin-password "$remote:$stage/"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          tar -xzf "$STAGE/discover-bootstrap.tgz" -C "$STAGE"

          if systemctl is-active --quiet persiantoolbox-discover 2>/dev/null; then printf active > "$STAGE/pre-service-active"; fi
          if systemctl is-enabled --quiet persiantoolbox-discover 2>/dev/null; then printf enabled > "$STAGE/pre-service-enabled"; fi
          if [[ -L /opt/persiantoolbox-discover/current ]]; then readlink -f /opt/persiantoolbox-discover/current > "$STAGE/pre-current-target"; fi
          if sudo test -f /etc/systemd/system/persiantoolbox-discover.service; then sudo cp -a /etc/systemd/system/persiantoolbox-discover.service "$STAGE/pre-service-unit"; fi
          if sudo test -f /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy; then sudo cp -a /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy "$STAGE/pre-caddy-site"; fi
          if sudo test -f /etc/systemd/system/caddy.service.d/discover-admin.conf; then sudo cp -a /etc/systemd/system/caddy.service.d/discover-admin.conf "$STAGE/pre-caddy-dropin"; fi
          if sudo test -f /etc/persiantoolbox-discover/caddy.env; then sudo cp -a /etc/persiantoolbox-discover/caddy.env "$STAGE/pre-caddy-env"; fi
          if sudo test -f /etc/persiantoolbox-discover/admin-owner-credentials; then sudo cp -a /etc/persiantoolbox-discover/admin-owner-credentials "$STAGE/pre-owner-credentials"; fi
          REMOTE

      - name: Activate canonical sidecar and Caddy auth boundary
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-bootstrap-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' RELEASE_ID='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGE"
          admin_user="$(cat "$STAGE/.discover-admin-user")"
          admin_password="$(cat "$STAGE/.discover-admin-password")"
          test -n "$admin_user" && test -n "$admin_password"

          sudo bash deploy/discover/install-discover-service.sh "$STAGE" "$RELEASE_ID"

          listen_count="$(sudo ss -ltnH 'sport = :8003' | awk '$4 == "127.0.0.1:8003" {count++} END {print count+0}')"
          test "$listen_count" = "1"
          ! sudo ss -ltnH 'sport = :8003' | awk '{print $4}' | grep -Evq '^127\.0\.0\.1:8003$'
          sudo test -f /var/lib/persiantoolbox-discover/discover.sqlite3
          ! sudo find /opt/persiantoolbox-discover/releases -type f -name '*.sqlite3' -print -quit | grep -q .

          admin_hash="$(sudo caddy hash-password --algorithm bcrypt --plaintext "$admin_password")"
          test -n "$admin_hash"
          sudo install -d -m 750 -o root -g persiantoolbox-discover /etc/persiantoolbox-discover
          private_env="$STAGE/caddy.env"
          owner_credentials="$STAGE/admin-owner-credentials"
          umask 077
          printf 'DISCOVER_ADMIN_USER=%s\nDISCOVER_ADMIN_PASSWORD_HASH=%s\n' "$admin_user" "$admin_hash" > "$private_env"
          printf 'username=%s\npassword=%s\n' "$admin_user" "$admin_password" > "$owner_credentials"
          sudo install -m 600 -o root -g root "$private_env" /etc/persiantoolbox-discover/caddy.env
          sudo install -m 600 -o root -g root "$owner_credentials" /etc/persiantoolbox-discover/admin-owner-credentials

          sudo install -d -m 755 /etc/systemd/system/caddy.service.d
          printf '%s\n' '[Service]' 'EnvironmentFile=/etc/persiantoolbox-discover/caddy.env' | \
            sudo tee /etc/systemd/system/caddy.service.d/discover-admin.conf >/dev/null
          sudo chmod 644 /etc/systemd/system/caddy.service.d/discover-admin.conf
          sudo systemctl daemon-reload

          export DISCOVER_ADMIN_USER="$admin_user"
          export DISCOVER_ADMIN_PASSWORD_HASH="$admin_hash"
          bash deploy/caddy/apply-caddy-config.sh
          sudo systemctl restart caddy
          sudo systemctl is-active --quiet caddy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8003/discover/api/health | grep -q '"ok":true'
          REMOTE

      - name: Verify public boundary and real zero-deploy CRUD
        run: |
          set -Eeuo pipefail
          admin_user="$(cat .discover-admin-user)"
          admin_password="$(cat .discover-admin-password)"

          curl --fail --silent --show-error --max-time 15 \
            https://llm.persiantoolbox.ir/discover/api/health | grep -q '"ok":true'

          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "$headers" \
            --write-out '%{http_code}' https://llm.persiantoolbox.ir/discover/admin/)"
          test "$status" = "401"
          grep -Eiq '^www-authenticate:.*basic' "$headers"
          rm -f "$headers"

          curl --fail --silent --show-error --max-time 15 --user "$admin_user:$admin_password" \
            --output /dev/null https://llm.persiantoolbox.ir/discover/api/admin/tools

          DISCOVER_ADMIN_USER="$admin_user" \
          DISCOVER_ADMIN_PASSWORD="$admin_password" \
          DISCOVER_BASE_URL="https://llm.persiantoolbox.ir/discover" \
            node scripts/check-discover-live-crud.mjs

      - name: Roll back failed activation
        if: failure()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [[ ! -f ~/.ssh/id_ed25519 || -z "${SSH_HOST:-}" || -z "${SSH_USER:-}" || -z "${SSH_PORT:-}" ]]; then
            exit 0
          fi
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-bootstrap-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' bash -se" <<'REMOTE' || true
          set -Eeuo pipefail
          [[ -d "$STAGE" ]] || exit 0

          sudo systemctl stop persiantoolbox-discover >/dev/null 2>&1 || true
          if [[ -s "$STAGE/pre-current-target" ]]; then
            previous="$(cat "$STAGE/pre-current-target")"
            if [[ -d "$previous" ]]; then
              sudo ln -sfn "$previous" /opt/persiantoolbox-discover/current.next
              sudo mv -Tf /opt/persiantoolbox-discover/current.next /opt/persiantoolbox-discover/current
            fi
          else
            sudo rm -f /opt/persiantoolbox-discover/current
          fi

          if [[ -f "$STAGE/pre-service-unit" ]]; then
            sudo cp -a "$STAGE/pre-service-unit" /etc/systemd/system/persiantoolbox-discover.service
          else
            sudo rm -f /etc/systemd/system/persiantoolbox-discover.service
          fi
          if [[ -f "$STAGE/pre-service-enabled" ]]; then sudo systemctl enable persiantoolbox-discover >/dev/null 2>&1 || true; else sudo systemctl disable persiantoolbox-discover >/dev/null 2>&1 || true; fi
          sudo systemctl daemon-reload
          if [[ -f "$STAGE/pre-service-active" ]]; then sudo systemctl start persiantoolbox-discover >/dev/null 2>&1 || true; fi

          if [[ -f "$STAGE/pre-caddy-site" ]]; then sudo cp -a "$STAGE/pre-caddy-site" /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy; else sudo rm -f /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy; fi
          if [[ -f "$STAGE/pre-caddy-dropin" ]]; then sudo cp -a "$STAGE/pre-caddy-dropin" /etc/systemd/system/caddy.service.d/discover-admin.conf; else sudo rm -f /etc/systemd/system/caddy.service.d/discover-admin.conf; fi
          if [[ -f "$STAGE/pre-caddy-env" ]]; then sudo cp -a "$STAGE/pre-caddy-env" /etc/persiantoolbox-discover/caddy.env; else sudo rm -f /etc/persiantoolbox-discover/caddy.env; fi
          if [[ -f "$STAGE/pre-owner-credentials" ]]; then sudo cp -a "$STAGE/pre-owner-credentials" /etc/persiantoolbox-discover/admin-owner-credentials; else sudo rm -f /etc/persiantoolbox-discover/admin-owner-credentials; fi
          sudo systemctl daemon-reload
          sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
          sudo systemctl restart caddy
          REMOTE

      - name: Remove bootstrap material
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [[ -f ~/.ssh/id_ed25519 && -n "${SSH_HOST:-}" && -n "${SSH_USER:-}" && -n "${SSH_PORT:-}" ]]; then
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "${SSH_USER}@${SSH_HOST}" "rm -rf -- '/tmp/persiantoolbox-discover-bootstrap-${GITHUB_SHA}'" || true
          fi
          rm -f discover-bootstrap.tgz .discover-admin-user .discover-admin-password
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
