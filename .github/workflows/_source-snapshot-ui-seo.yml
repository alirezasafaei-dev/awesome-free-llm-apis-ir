name: Temporary UI SEO source snapshot

on:
  push:
    branches:
      - agent/ui-seo-home-language-focus-2026-08-05
    paths:
      - ".github/workflows/_source-snapshot-ui-seo.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_source-snapshot-ui-seo.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - name: Package source
        run: tar --exclude=.git --exclude=.site-dist --exclude=node_modules -czf source-snapshot-ui-seo.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-snapshot-ui-seo-${{ github.sha }}
          path: source-snapshot-ui-seo.tgz
          if-no-files-found: error
          retention-days: 1
