name: Deploy VPS mirrors

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: both
        type: choice
        options:
          - both
          - global
          - iran

permissions:
  contents: read

# Every main revision must reach the production release workflow. The previous
# path-filter plus compensating dispatcher allowed a valid main revision to reach
# GitHub Pages while the canonical VPS remained on an older source revision.
concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  privacy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - name: Ensure no infrastructure secrets in public workflow
        run: |
          set -Eeuo pipefail
          WORKFLOW_FILE=".github/workflows/deploy-vps.yml"
          IP_PATTERN='[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
          USER_HOST_PATTERN='[a-z]+@[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}'
          if grep -EoP "$IP_PATTERN" "$WORKFLOW_FILE" | grep -vE '^(127\.0\.0\.1|0\.0\.0\.0)$'; then
            echo "FAIL: IPv4 address found in public workflow" >&2
            exit 1
          fi
          if grep -EoP "$USER_HOST_PATTERN" "$WORKFLOW_FILE"; then
            echo "FAIL: user@IPv4 pattern found in public workflow" >&2
            exit 1
          fi
          echo "Privacy check passed: no infrastructure secrets in public workflow"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run site:build
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - name: Prepare verified Discover Node runtime
        run: bash deploy/discover/prepare-node-runtime.sh .discover-runtime
      - name: Package immutable static release
        run: tar -C .site-dist -czf site-release.tar.gz .
      - name: Package bounded Discover service release
        run: |
          tar -czf discover-service-release.tar.gz \
            services/discover \
            deploy/discover \
            deploy/caddy/llm.persiantoolbox.ir.caddy \
            deploy/caddy/apply-caddy-config.sh \
            node_modules/simple-icons \
            .discover-runtime \
            package.json package-lock.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: site-release-${{ github.sha }}
          path: |
            site-release.tar.gz
            discover-service-release.tar.gz
            scripts/check-discover-live-crud.mjs
            deploy/remote-release.sh
            deploy/rollback-release.sh
            deploy/publish-release-over-ssh.sh
          if-no-files-found: error
          retention-days: 7

  deploy-global:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'global'
    needs: [build, privacy-check]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production-global
      url: https://llm.persiantoolbox.ir/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          name: site-release-${{ github.sha }}

      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null

      - name: Prepare Discover admin credential
        env:
          CONFIGURED_ADMIN_USER: ${{ secrets.DISCOVER_ADMIN_USER }}
          CONFIGURED_ADMIN_PASSWORD: ${{ secrets.DISCOVER_ADMIN_PASSWORD }}
        run: |
          set -Eeuo pipefail
          admin_user="${CONFIGURED_ADMIN_USER:-discover-admin}"
          admin_password="${CONFIGURED_ADMIN_PASSWORD:-}"
          if [[ -z "$admin_password" ]]; then
            admin_password="$(openssl rand -hex 32)"
          fi
          [[ "$admin_user" =~ ^[A-Za-z0-9._-]{8,64}$ ]]
          [[ "$admin_password" =~ ^[A-Za-z0-9._~+-]{24,128}$ ]]
          umask 077
          printf '%s' "$admin_user" > .discover-admin-user
          printf '%s' "$admin_password" > .discover-admin-password
          chmod 600 .discover-admin-user .discover-admin-password

      - name: Capture Discover rollback state
        id: discover_state
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" \
            "rm -rf -- '$stage' && install -d -m 700 '$stage'"
          scp -i ~/.ssh/id_ed25519 -P "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            discover-service-release.tar.gz .discover-admin-user .discover-admin-password "$remote:$stage/"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          tar -xzf "$STAGE/discover-service-release.tar.gz" -C "$STAGE"
          if systemctl is-active --quiet persiantoolbox-discover 2>/dev/null; then printf active > "$STAGE/pre-service-active"; fi
          if systemctl is-enabled --quiet persiantoolbox-discover 2>/dev/null; then printf enabled > "$STAGE/pre-service-enabled"; fi
          if [[ -L /opt/persiantoolbox-discover/current ]]; then readlink -f /opt/persiantoolbox-discover/current > "$STAGE/pre-current-target"; fi
          if [[ -L /usr/local/bin/persiantoolbox-discover-node ]]; then readlink -f /usr/local/bin/persiantoolbox-discover-node > "$STAGE/pre-runtime-target"; fi
          if sudo test -f /etc/systemd/system/persiantoolbox-discover.service; then sudo cp -a /etc/systemd/system/persiantoolbox-discover.service "$STAGE/pre-service-unit"; fi
          if sudo test -f /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy; then sudo cp -a /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy "$STAGE/pre-caddy-site"; fi
          if sudo test -f /etc/systemd/system/caddy.service.d/discover-admin.conf; then sudo cp -a /etc/systemd/system/caddy.service.d/discover-admin.conf "$STAGE/pre-caddy-dropin"; fi
          if sudo test -f /etc/persiantoolbox-discover/caddy.env; then sudo cp -a /etc/persiantoolbox-discover/caddy.env "$STAGE/pre-caddy-env"; fi
          if sudo test -f /etc/persiantoolbox-discover/admin-owner-credentials; then sudo cp -a /etc/persiantoolbox-discover/admin-owner-credentials "$STAGE/pre-owner-credentials"; fi
          REMOTE

      - name: Activate Discover sidecar before static publication
        id: discover_activation
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' RELEASE_ID='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail
          cd "$STAGE"
          admin_user="$(cat "$STAGE/.discover-admin-user")"
          admin_password="$(cat "$STAGE/.discover-admin-password")"
          test -n "$admin_user" && test -n "$admin_password"

          sudo bash deploy/discover/install-discover-service.sh "$STAGE" "$RELEASE_ID"

          listen_count="$(sudo ss -ltnH 'sport = :8003' | awk '$4 == "127.0.0.1:8003" {count++} END {print count+0}')"
          test "$listen_count" = "1"
          ! sudo ss -ltnH 'sport = :8003' | awk '{print $4}' | grep -Evq '^127\.0\.0\.1:8003$'
          sudo test -f /var/lib/persiantoolbox-discover/discover.sqlite3
          ! sudo find /opt/persiantoolbox-discover/releases -type f -name '*.sqlite3' -print -quit | grep -q .

          admin_hash="$(printf '%s' "$admin_password" | sudo caddy hash-password --algorithm bcrypt)"
          test -n "$admin_hash"
          sudo install -d -m 750 -o root -g persiantoolbox-discover /etc/persiantoolbox-discover
          private_env="$STAGE/caddy.env"
          owner_credentials="$STAGE/admin-owner-credentials"
          umask 077
          printf 'DISCOVER_ADMIN_USER=%s\nDISCOVER_ADMIN_PASSWORD_HASH=%s\n' "$admin_user" "$admin_hash" > "$private_env"
          printf 'username=%s\npassword=%s\n' "$admin_user" "$admin_password" > "$owner_credentials"
          sudo install -m 600 -o root -g root "$private_env" /etc/persiantoolbox-discover/caddy.env
          sudo install -m 600 -o root -g root "$owner_credentials" /etc/persiantoolbox-discover/admin-owner-credentials

          sudo install -d -m 755 /etc/systemd/system/caddy.service.d
          printf '%s\n' '[Service]' 'EnvironmentFile=/etc/persiantoolbox-discover/caddy.env' | \
            sudo tee /etc/systemd/system/caddy.service.d/discover-admin.conf >/dev/null
          sudo chmod 644 /etc/systemd/system/caddy.service.d/discover-admin.conf
          sudo systemctl daemon-reload

          export DISCOVER_ADMIN_USER="$admin_user"
          export DISCOVER_ADMIN_PASSWORD_HASH="$admin_hash"
          bash deploy/caddy/apply-caddy-config.sh
          sudo systemctl restart caddy
          sudo systemctl is-active --quiet caddy
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8003/discover/api/health | grep -q '"ok":true'
          REMOTE

      - name: Prove Discover zero-deploy CRUD before static publication
        run: |
          set -Eeuo pipefail
          admin_user="$(cat .discover-admin-user)"
          admin_password="$(cat .discover-admin-password)"

          curl --fail --silent --show-error --max-time 15 \
            https://llm.persiantoolbox.ir/discover/api/health | grep -q '"ok":true'

          headers="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "$headers" \
            --write-out '%{http_code}' https://llm.persiantoolbox.ir/discover/admin/)"
          test "$status" = "401"
          grep -Eiq '^www-authenticate:.*basic' "$headers"
          rm -f "$headers"

          curl --fail --silent --show-error --max-time 15 --user "$admin_user:$admin_password" \
            --output /dev/null https://llm.persiantoolbox.ir/discover/api/admin/tools

          DISCOVER_ADMIN_USER="$admin_user" \
          DISCOVER_ADMIN_PASSWORD="$admin_password" \
          DISCOVER_BASE_URL="https://llm.persiantoolbox.ir/discover" \
            node scripts/check-discover-live-crud.mjs

      - name: Publish atomic release
        id: release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: bash deploy/publish-release-over-ssh.sh

      - name: Verify canonical deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          admin_user="$(cat .discover-admin-user)"
          admin_password="$(cat .discover-admin-password)"
          for attempt in $(seq 1 12); do
            headers="$(mktemp)"
            body="$(mktemp)"
            if curl --fail --silent --show-error --location --max-time 15 \
              --dump-header "$headers" --output /dev/null \
              https://llm.persiantoolbox.ir/ && \
              curl --fail --silent --show-error --location --max-time 15 \
              --output "$body" \
              https://llm.persiantoolbox.ir/build-meta.json && \
              EXPECTED_SHA="$EXPECTED_SHA" META_FILE="$body" node -e '
                const fs = require("node:fs");
                const meta = JSON.parse(fs.readFileSync(process.env.META_FILE, "utf8"));
                if (meta.source_revision !== process.env.EXPECTED_SHA) process.exit(1);
                if (!Number.isInteger(meta.provider_count) || meta.provider_count < 1) process.exit(1);
              ' && \
              curl --fail --silent --show-error --max-time 15 --output /dev/null \
                https://llm.persiantoolbox.ir/discover/ && \
              curl --fail --silent --show-error --max-time 15 --user "$admin_user:$admin_password" \
                https://llm.persiantoolbox.ir/discover/admin/ | grep -q 'مدیریت لینک‌های ریلز' && \
              curl --fail --silent --show-error --max-time 15 --output /dev/null \
                https://llm.persiantoolbox.ir/discover/api/icons/simple-icons/github.svg; then
              if grep -Eiq '^x-robots-tag:.*noindex' "$headers"; then
                echo 'Canonical endpoint unexpectedly contains noindex.' >&2
              else
                rm -f "$headers" "$body"
                exit 0
              fi
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          exit 1

      - name: Roll back failed publication
        if: failure() && steps.release.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "bash /tmp/llm-rollback-${GITHUB_SHA}.sh ${DEPLOY_ROOT}"

      - name: Rollback Discover activation after failed publication
        if: failure() && steps.discover_state.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -Eeuo pipefail
          remote="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/persiantoolbox-discover-${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$remote" "STAGE='$stage' bash -se" <<'REMOTE' || true
          set -Eeuo pipefail
          [[ -d "$STAGE" ]] || exit 0

          sudo systemctl stop persiantoolbox-discover >/dev/null 2>&1 || true
          if [[ -s "$STAGE/pre-current-target" ]]; then
            previous="$(cat "$STAGE/pre-current-target")"
            if [[ -d "$previous" ]]; then
              sudo ln -sfn "$previous" /opt/persiantoolbox-discover/current.next
              sudo mv -Tf /opt/persiantoolbox-discover/current.next /opt/persiantoolbox-discover/current
            fi
          else
            sudo rm -f /opt/persiantoolbox-discover/current
          fi

          if [[ -s "$STAGE/pre-runtime-target" ]]; then
            previous_runtime="$(cat "$STAGE/pre-runtime-target")"
            if [[ -x "$previous_runtime" ]]; then
              sudo ln -sfn "$previous_runtime" /usr/local/bin/persiantoolbox-discover-node.next
              sudo mv -Tf /usr/local/bin/persiantoolbox-discover-node.next /usr/local/bin/persiantoolbox-discover-node
              if command -v restorecon >/dev/null 2>&1; then sudo restorecon -F /usr/local/bin/persiantoolbox-discover-node >/dev/null 2>&1 || true; fi
            fi
          else
            sudo rm -f /usr/local/bin/persiantoolbox-discover-node
          fi

          if [[ -f "$STAGE/pre-service-unit" ]]; then
            sudo cp -a "$STAGE/pre-service-unit" /etc/systemd/system/persiantoolbox-discover.service
          else
            sudo rm -f /etc/systemd/system/persiantoolbox-discover.service
          fi
          if [[ -f "$STAGE/pre-service-enabled" ]]; then
            sudo systemctl enable persiantoolbox-discover >/dev/null 2>&1 || true
          else
            sudo systemctl disable persiantoolbox-discover >/dev/null 2>&1 || true
          fi
          sudo systemctl daemon-reload
          if [[ -f "$STAGE/pre-service-active" ]]; then sudo systemctl start persiantoolbox-discover >/dev/null 2>&1 || true; fi

          if [[ -f "$STAGE/pre-caddy-site" ]]; then sudo cp -a "$STAGE/pre-caddy-site" /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy; else sudo rm -f /etc/caddy/sites-enabled/llm.persiantoolbox.ir.caddy; fi
          if [[ -f "$STAGE/pre-caddy-dropin" ]]; then sudo cp -a "$STAGE/pre-caddy-dropin" /etc/systemd/system/caddy.service.d/discover-admin.conf; else sudo rm -f /etc/systemd/system/caddy.service.d/discover-admin.conf; fi
          if [[ -f "$STAGE/pre-caddy-env" ]]; then sudo cp -a "$STAGE/pre-caddy-env" /etc/persiantoolbox-discover/caddy.env; else sudo rm -f /etc/persiantoolbox-discover/caddy.env; fi
          if [[ -f "$STAGE/pre-owner-credentials" ]]; then sudo cp -a "$STAGE/pre-owner-credentials" /etc/persiantoolbox-discover/admin-owner-credentials; else sudo rm -f /etc/persiantoolbox-discover/admin-owner-credentials; fi
          sudo systemctl daemon-reload
          sudo caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
          sudo systemctl restart caddy
          REMOTE

      - name: Remove Discover staging and local SSH material
        if: always()
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          if [[ -f ~/.ssh/id_ed25519 && -n "${SSH_HOST:-}" && -n "${SSH_USER:-}" && -n "${SSH_PORT:-}" ]]; then
            ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "${SSH_USER}@${SSH_HOST}" "rm -rf -- '/tmp/persiantoolbox-discover-${GITHUB_SHA}'" || true
          fi
          rm -f .discover-admin-user .discover-admin-password discover-service-release.tar.gz
          rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

  deploy-iran:
    if: github.event_name == 'push' || inputs.target == 'both' || inputs.target == 'iran'
    needs: [build, privacy-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-iran
      url: https://ir.llm.persiantoolbox.ir/
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          name: site-release-${{ github.sha }}
      - name: Configure pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Publish atomic release
        id: release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: bash deploy/publish-release-over-ssh.sh
      - name: Verify Iran mirror deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            headers="$(mktemp)"
            body="$(mktemp)"
            if curl --fail --silent --show-error --location --max-time 15 \
              --dump-header "$headers" --output /dev/null \
              https://ir.llm.persiantoolbox.ir/ && \
              curl --fail --silent --show-error --location --max-time 15 \
              --output "$body" \
              https://ir.llm.persiantoolbox.ir/build-meta.json && \
              EXPECTED_SHA="$EXPECTED_SHA" META_FILE="$body" node -e '
                const fs = require("node:fs");
                const meta = JSON.parse(fs.readFileSync(process.env.META_FILE, "utf8"));
                if (meta.source_revision !== process.env.EXPECTED_SHA) process.exit(1);
                if (!Number.isInteger(meta.provider_count) || meta.provider_count < 1) process.exit(1);
              '; then
              if grep -Eiq '^x-robots-tag:.*noindex' "$headers"; then
                rm -f "$headers" "$body"
                exit 0
              fi
              echo 'Iran mirror is missing X-Robots-Tag noindex.' >&2
            fi
            rm -f "$headers" "$body"
            sleep 5
          done
          exit 1
      - name: Roll back failed publication
        if: failure() && steps.release.outcome == 'success'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "${SSH_USER}@${SSH_HOST}" "bash /tmp/llm-rollback-${GITHUB_SHA}.sh ${DEPLOY_ROOT}"
      - name: Remove local SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts

  verify-mirror-consistency:
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.target == 'both') &&
      needs.deploy-global.result == 'success' &&
      needs.deploy-iran.result == 'success'
    needs: [deploy-global, deploy-iran]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify both public mirrors expose the same release
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error --location --max-time 15 \
            https://llm.persiantoolbox.ir/build-meta.json -o /tmp/global-meta.json
          curl --fail --silent --show-error --location --max-time 15 \
            https://ir.llm.persiantoolbox.ir/build-meta.json -o /tmp/iran-meta.json
          EXPECTED_SHA="$EXPECTED_SHA" node <<'NODE'
          const fs = require('node:fs');
          const globalMeta = JSON.parse(fs.readFileSync('/tmp/global-meta.json', 'utf8'));
          const iranMeta = JSON.parse(fs.readFileSync('/tmp/iran-meta.json', 'utf8'));
          const expected = process.env.EXPECTED_SHA;
          if (globalMeta.source_revision !== expected || iranMeta.source_revision !== expected) {
            throw new Error('One or both mirrors expose an unexpected source_revision');
          }
          if (globalMeta.provider_count !== iranMeta.provider_count) {
            throw new Error('Provider counts differ between global and Iran mirrors');
          }
          NODE