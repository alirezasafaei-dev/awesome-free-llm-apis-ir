name: Deploy VPS mirrors

# Historical name retained for release-status integrations; only the canonical
# domain is deployed. The retired mirror and Caddy are not deployment targets.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-vps-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  privacy-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run privacy:test && npm run privacy:evidence:test && npm run privacy:github:test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run release:check -- --revision=${{ github.sha }}
      - name: Prepare verified Discover Node runtime
        run: bash deploy/discover/prepare-node-runtime.sh .discover-runtime
      - name: Package bounded immutable application release
        run: |
          set -Eeuo pipefail
          mkdir -p bundle/site bundle/service/services bundle/service/node_modules bundle/service/deploy bundle/service/.discover-runtime
          cp -a .site-dist/. bundle/site/
          cp -a services/discover bundle/service/services/
          cp -a node_modules/simple-icons bundle/service/node_modules/
          cp -a deploy/discover bundle/service/deploy/
          cp .discover-runtime/*-linux-x64.tar.gz bundle/service/.discover-runtime/
          cp package.json package-lock.json bundle/service/
          tar -C bundle -czf production-release.tar.gz site service
          sha256sum production-release.tar.gz > production-release.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: production-release-${{ github.sha }}
          path: |
            production-release.tar.gz
            production-release.sha256
          if-no-files-found: error
          retention-days: 7

  deploy-global:
    if: github.ref == 'refs/heads/main'
    needs: [build, privacy-check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-global
      url: https://llm.persiantoolbox.ir/
    env:
      SSH_HOST: ${{ secrets.NGINX_SSH_HOST }}
      SSH_USER: ${{ secrets.NGINX_SSH_USER }}
      SSH_PORT: ${{ secrets.NGINX_SSH_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.3.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4.1.8
        with:
          name: production-release-${{ github.sha }}
      - name: Configure restricted pinned SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NGINX_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.NGINX_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PORT"
          test -n "$SSH_PRIVATE_KEY" && test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
      - name: Upload checksum-bound release
        run: |
          set -Eeuo pipefail
          sha256sum --check --strict production-release.sha256
          expected="$(sha256sum production-release.tar.gz | cut -d' ' -f1)"
          actual="$(ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "${SSH_USER}@${SSH_HOST}" "upload ${GITHUB_SHA}" < production-release.tar.gz)"
          test "$actual" = "$expected"
          printf '%s' "$actual" > .release-digest
      - name: Publish application and prove authenticated Discover CRUD
        id: release
        run: |
          set -Eeuo pipefail
          digest="$(cat .release-digest)"
          ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "${SSH_USER}@${SSH_HOST}" "publish ${GITHUB_SHA} ${digest}"
      - name: Verify exact canonical release and full UX
        run: |
          set -Eeuo pipefail
          node scripts/check-production-smoke.mjs --target=global --expected-revision=${GITHUB_SHA} --report=production-smoke.md
          node scripts/check-production-ux-smoke.mjs --target=global --expected-revision=${GITHUB_SHA} --report=ux-smoke.md
      - name: Roll back failed publication
        if: always() && (failure() || cancelled()) && steps.release.outcome != 'skipped' && steps.release.outcome != ''
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          for attempt in {1..12}; do
            if ssh -i ~/.ssh/id_ed25519 -p "$SSH_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 "${SSH_USER}@${SSH_HOST}" "rollback ${GITHUB_SHA}"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Upload sanitized verification reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: canonical-release-reports-${{ github.sha }}
          path: |
            production-smoke.md
            ux-smoke.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove local SSH material
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts .release-digest
