name: Sync generated artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: sync-generated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Apply report-driven P1 content fixes
        if: github.head_ref == 'agent/p1-content-finalize-2026-08-06'
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/audit-content-quality.mjs --json > /tmp/content-audit.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          report = json.loads(Path('/tmp/content-audit.json').read_text(encoding='utf-8'))
          targets = {
              'api-key-security',
              'free-embedding-api',
              'free-tier-trial-credit',
              'official-gateway-vs-community-gateway',
              'permanent-free-models',
              'provider-for-student-mvp',
              'secure-api-testing-iran',
          }
          topics = {
              'api-key-security': 'امنیت و چرخه عمر API Key',
              'free-embedding-api': 'انتخاب و استفاده از API رایگان Embedding',
              'free-tier-trial-credit': 'تفاوت Free Tier، دوره آزمایشی و اعتبار هدیه',
              'official-gateway-vs-community-gateway': 'انتخاب میان Gateway رسمی و Gateway اجتماعی',
              'permanent-free-models': 'ارزیابی مدل‌های دارای دسترسی رایگان پایدار',
              'provider-for-student-mvp': 'انتخاب Provider برای MVP دانشجویی',
              'secure-api-testing-iran': 'تست امن API از ایران',
          }
          snippets = {
              'intent': lambda topic: f'''## هدف این راهنما و نیت جست‌وجو\n\nاین راهنما برای کاربری نوشته شده است که می‌خواهد درباره «{topic}» تصمیم عملی بگیرد، محدودیت‌ها را پیش از پیاده‌سازی بشناسد و انتخاب خود را با داده تاریخ‌دار اعتبارسنجی کند.\n''',
              'signup': lambda topic: '''## ثبت‌نام و ساخت حساب\n\nثبت‌نام را فقط از دامنه و مستندات رسمی Provider انجام دهید. پیش از واردکردن اطلاعات، نیاز به کارت بانکی بین‌المللی، شماره موبایل خارجی یا احراز هویت را جداگانه بررسی کنید؛ این پیش‌نیازهای حساب به معنی مسدودبودن شبکه نیستند.\n''',
              'first-request': lambda topic: '''## اولین درخواست API\n\nپس از دریافت کلید، ابتدا یک درخواست کم‌حجم با مدل مستندشده اجرا کنید و کلید را فقط از متغیر محیطی بخوانید:\n\n```bash\ncurl "$LLM_BASE_URL/chat/completions" \\\n  -H "Authorization: Bearer $LLM_API_KEY" \\\n  -H "Content-Type: application/json" \\\n  -d '{"model":"VERIFIED_MODEL_ID","messages":[{"role":"user","content":"ping"}],"max_tokens":16}'\n```\n\nموفقیت HTTP به‌تنهایی کافی نیست؛ بدنه پاسخ، شناسه مدل و مصرف سهمیه را نیز بررسی کنید.\n''',
              'quota': lambda topic: '''## سهمیه و محدودیت‌ها\n\nسهمیه رایگان، RPM، TPM و اعتبار حساب ممکن است بر اساس مدل یا زمان تغییر کند. مقدارهای کاتالوگ را نقطه شروع بدانید و پیش از Production، Dashboard و Headerهای Rate Limit حساب خود را کنترل کنید.\n''',
              'iran': lambda topic: '''## وضعیت ایران و شواهد\n\nچهار مرحله را جدا ثبت کنید: دسترسی شبکه، تکمیل ثبت‌نام، صدور کلید و اجرای Inference. اتصال با فیلترشکن باید «متصل با فیلترشکن» گزارش شود؛ نیاز به کارت یا شماره خارجی نیز باید به‌عنوان پیش‌نیاز حساب ثبت شود، نه مسدودیت شبکه.\n''',
              'errors': lambda topic: '''## خطاهای رایج و رفع اشکال\n\n- `401`: کلید، Header و متغیر محیطی را بررسی کنید.\n- `403`: محدودیت حساب، منطقه یا فعال‌سازی را جدا از اتصال شبکه بررسی کنید.\n- `404` یا `model_not_found`: شناسه دقیق مدل و Base URL رسمی را تطبیق دهید.\n- `429`: Backoff، صف درخواست و سقف‌های RPM/TPM را اعمال کنید.\n''',
              'when-not-to-use': lambda topic: '''## چه زمانی این انتخاب مناسب نیست؟\n\nاگر SLA، ظرفیت تضمین‌شده، نگهداری داده در منطقه مشخص یا پشتیبانی قراردادی لازم دارید، صرفاً به سهمیه رایگان تکیه نکنید. برای Production حساس، Provider جایگزین و مسیر Failover داشته باشید.\n''',
              'references': lambda topic: '''## منابع رسمی و تاریخ‌دار\n\nبرای تصمیم نهایی، مستندات رسمی Provider، صفحه Pricing/Free Tier و Dashboard حساب را در همان روز بررسی کنید. وضعیت‌های مقایسه‌ای پروژه در [کاتالوگ APIهای رایگان](https://llm.persiantoolbox.ir/) همراه با تاریخ بررسی نگهداری می‌شوند.\n''',
              'links': lambda topic: '''## مطالب مرتبط\n\n- [کاتالوگ APIهای رایگان LLM](https://llm.persiantoolbox.ir/)\n- [شروع سریع اولین درخواست](https://llm.persiantoolbox.ir/quick-start/)\n- [روش‌شناسی بررسی شواهد](https://llm.persiantoolbox.ir/methodology/)\n- [مخزن و گزارش خطا](https://github.com/alirezasafaei-dev/awesome-free-llm-apis-ir)\n''',
          }

          touched = []
          for item in report.get('reports', []):
              if item.get('type') != 'guide' or item.get('id') not in targets:
                  continue
              slug = item['id']
              path = Path('content/fa') / f'{slug}.md'
              text = path.read_text(encoding='utf-8')
              additions = [snippets[key](topics[slug]) for key in item.get('missing_sections', [])]
              if additions:
                  block = '\n' + '\n'.join(additions).rstrip() + '\n\n'
                  marker = '\n## جمع‌بندی'
                  if marker in text:
                      text = text.replace(marker, block + '## جمع‌بندی', 1)
                  else:
                      text = text.rstrip() + block
                  path.write_text(text, encoding='utf-8')
                  touched.append(str(path))

          ipv4 = re.compile(r'(?<![0-9])(?:[0-9]{1,3}\.){3}[0-9]{1,3}(?![0-9])')
          for path in [Path('content/fa/secure-api-testing-iran.md'), Path('content/en/secure-api-testing-iran.md')]:
              text = path.read_text(encoding='utf-8')
              sanitized, count = ipv4.subn('[IP_REDACTED]', text)
              if count:
                  path.write_text(sanitized, encoding='utf-8')
                  touched.append(str(path))

          if not touched:
              raise SystemExit('P1 finalizer made no changes')
          print('Updated:', ', '.join(sorted(set(touched))))
          PY

      - name: Regenerate canonical artifacts
        run: npm run generate

      - name: Reject unexpected writes
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          allowed='^(README\.md|catalog\.json|data\.json|content/(fa|en)/(api-key-security|free-embedding-api|free-tier-trial-credit|official-gateway-vs-community-gateway|permanent-free-models|provider-for-student-mvp|secure-api-testing-iran)\.md)$'
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Workflow modified unexpected paths:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Validate synchronized repository
        run: npm test

      - name: Commit synchronized repository
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'Repository is already synchronized.'
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md catalog.json data.json content/fa/*.md content/en/*.md
          git commit -m 'fix(content): satisfy quality and publication privacy contracts'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
