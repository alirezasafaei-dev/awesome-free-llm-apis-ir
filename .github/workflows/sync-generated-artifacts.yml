name: Sync generated artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: sync-generated-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Apply access-semantics finalization
        if: github.head_ref == 'agent/access-requirements-ux-seo-2026-08-06'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_guard = 'if (location.search.includes("usecase=") || location.search.includes("budget=") || location.search.includes("region=")) runFinder();'
          for path in [Path("site/api-finder/finder-core.js"), Path("site/en/api-finder/finder-core.js")]:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_guard)
              if count == 1:
                  path.write_text(text.replace(old_guard, 'runFinder();'), encoding="utf-8")
              elif count != 0 or 'runFinder();' not in text:
                  raise SystemExit(f"{path}: unexpected Finder initialization state")

          footer_path = Path("scripts/test-site-footer-contract.mjs")
          footer = footer_path.read_text(encoding="utf-8")
          old_footer = '  const expectedFooter = renderSiteFooter(footerContextFromRelativePath(relativePath));'
          new_footer = '''  const footerContext = footerContextFromRelativePath(relativePath);
          const brandLead = actualFooter.match(/<div class="footer-brand">[\\s\\S]*?<p>([\\s\\S]*?)<\\/p>/i)?.[1];
          const expectedFooter = renderSiteFooter({
            ...footerContext,
            ...(brandLead ? { brandLead } : {})
          });'''
          count = footer.count(old_footer)
          if count == 1:
              footer_path.write_text(footer.replace(old_footer, new_footer), encoding="utf-8")
          elif count != 0 or 'const brandLead = actualFooter.match' not in footer:
              raise SystemExit(f"{footer_path}: unexpected footer contract state")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Regenerate canonical artifacts
        run: npm run generate

      - name: Reject unexpected writes
        shell: bash
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only)"
          if [[ "${GITHUB_HEAD_REF}" == 'agent/access-requirements-ux-seo-2026-08-06' ]]; then
            allowed='^(README\.md|catalog\.json|data\.json|site/(api-finder/finder-core\.js|en/api-finder/finder-core\.js)|scripts/test-site-footer-contract\.mjs)$'
          else
            allowed='^(README\.md|catalog\.json|data\.json)$'
          fi
          unexpected="$(printf '%s\n' "$changed" | grep -Ev "$allowed" || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Workflow modified unexpected paths:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Validate synchronized repository
        run: npm test

      - name: Commit synchronized repository
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo 'Repository is already synchronized.'
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "${GITHUB_HEAD_REF}" == 'agent/access-requirements-ux-seo-2026-08-06' ]]; then
            git add README.md catalog.json data.json site/api-finder/finder-core.js site/en/api-finder/finder-core.js scripts/test-site-footer-contract.mjs
            git commit -m 'fix(ux): finalize connection and account semantics'
          else
            git add README.md catalog.json data.json
            git commit -m 'chore(generated): sync repository artifacts'
          fi
          git push origin "HEAD:${GITHUB_HEAD_REF}"
