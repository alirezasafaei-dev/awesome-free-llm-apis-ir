name: P1 source snapshot

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/build-p1-ui-shell-source-owned-2026-08-04

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Package exact public repository source
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/source-snapshot.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/head-sha.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tree-sha.txt"
          tar --exclude=.git --exclude=.site-dist --exclude=node_modules -czf "$archive" .
          test -s "$archive"
          test -s "$RUNNER_TEMP/head-sha.txt"
          test -s "$RUNNER_TEMP/tree-sha.txt"
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p1-source-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/source-snapshot.tar.gz
            ${{ runner.temp }}/head-sha.txt
            ${{ runner.temp }}/tree-sha.txt
          if-no-files-found: error
          retention-days: 1
