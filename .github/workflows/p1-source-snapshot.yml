name: P1 source snapshot

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/build-p1-ui-shell-source-owned-2026-08-04

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package public repository source
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=.site-dist --exclude=node_modules -czf source-snapshot.tar.gz .
          test -s source-snapshot.tar.gz
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p1-source-snapshot-${{ github.sha }}
          path: source-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
