name: Branch finalize one-shot

on:
  push:
    branches:
      - agent/access-requirements-ux-seo-2026-08-06

permissions:
  contents: write

concurrency:
  group: branch-finalize-one-shot
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/access-requirements-ux-seo-2026-08-06
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Apply exact source fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          finder_paths = [
              Path("site/api-finder/finder-core.js"),
              Path("site/en/api-finder/finder-core.js"),
          ]
          old = 'if (location.search.includes("usecase=") || location.search.includes("budget=") || location.search.includes("region=")) runFinder();'
          new = 'runFinder();'
          for path in finder_paths:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one default-render guard, found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          footer_path = Path("scripts/test-site-footer-contract.mjs")
          footer = footer_path.read_text(encoding="utf-8")
          old_footer = '  const expectedFooter = renderSiteFooter(footerContextFromRelativePath(relativePath));'
          new_footer = '''  const footerContext = footerContextFromRelativePath(relativePath);
          const brandLead = actualFooter.match(/<div class="footer-brand">[\\s\\S]*?<p>([\\s\\S]*?)<\\/p>/i)?.[1];
          const expectedFooter = renderSiteFooter({
            ...footerContext,
            ...(brandLead ? { brandLead } : {})
          });'''
          count = footer.count(old_footer)
          if count != 1:
              raise SystemExit(f"{footer_path}: expected one footer renderer call, found {count}")
          footer_path.write_text(footer.replace(old_footer, new_footer), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify focused contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check site/api-finder/finder-core.js
          node --check site/en/api-finder/finder-core.js
          npm run ux:footer:test
          npm run ux:finder:test

      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git rm .github/workflows/branch-finalize-one-shot.yml
          git add site/api-finder/finder-core.js site/en/api-finder/finder-core.js scripts/test-site-footer-contract.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ux): render default finder results and preserve footer leads"
          git push origin HEAD:agent/access-requirements-ux-seo-2026-08-06
