name: Branch finalize one-shot

on:
  push:
    branches:
      - agent/access-requirements-ux-seo-2026-08-06

permissions:
  contents: write

concurrency:
  group: branch-finalize-one-shot
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/access-requirements-ux-seo-2026-08-06
          fetch-depth: 0

      - name: Apply exact source fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old_guard = 'if (location.search.includes("usecase=") || location.search.includes("budget=") || location.search.includes("region=")) runFinder();'
          for path in [Path("site/api-finder/finder-core.js"), Path("site/en/api-finder/finder-core.js")]:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_guard)
              if count != 1:
                  raise SystemExit(f"{path}: expected one default-render guard, found {count}")
              path.write_text(text.replace(old_guard, 'runFinder();'), encoding="utf-8")

          footer_path = Path("scripts/test-site-footer-contract.mjs")
          footer = footer_path.read_text(encoding="utf-8")
          old_footer = '  const expectedFooter = renderSiteFooter(footerContextFromRelativePath(relativePath));'
          new_footer = '''  const footerContext = footerContextFromRelativePath(relativePath);
          const brandLead = actualFooter.match(/<div class="footer-brand">[\\s\\S]*?<p>([\\s\\S]*?)<\\/p>/i)?.[1];
          const expectedFooter = renderSiteFooter({
            ...footerContext,
            ...(brandLead ? { brandLead } : {})
          });'''
          count = footer.count(old_footer)
          if count != 1:
              raise SystemExit(f"{footer_path}: expected one footer renderer call, found {count}")
          footer_path.write_text(footer.replace(old_footer, new_footer), encoding="utf-8")
          PY

      - name: Commit exact source fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          git add site/api-finder/finder-core.js site/en/api-finder/finder-core.js scripts/test-site-footer-contract.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ux): render default finder results and preserve footer leads"
          git push origin HEAD:agent/access-requirements-ux-seo-2026-08-06
